name: Enterprise CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Enterprise Automated Tests
        run: npm test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mock-ci-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-ci-anon-key-with-sufficient-length-for-validation

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mock-ci-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-ci-anon-key-with-sufficient-length-for-validation

